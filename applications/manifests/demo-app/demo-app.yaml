##################################################
################ load-generator ##################
##################################################
# Stands in for real users: hits core-ui every 5s, which fans through every tier.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: load-generator
  namespace: demo-app
  labels:
    app.kubernetes.io/name: load-generator
    app.kubernetes.io/part-of: demo-app
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: demo-app
  labels:
    app.kubernetes.io/name: load-generator
    app.kubernetes.io/component: load-generator
    app.kubernetes.io/part-of: demo-app
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: load-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-generator
        app.kubernetes.io/component: load-generator
        app.kubernetes.io/part-of: demo-app
    spec:
      serviceAccountName: load-generator
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: busybox
          image: busybox:1.37.0
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                for path in / /api/; do
                  wget -q -T 5 -O /dev/null "http://core-ui$path" || echo "request to core-ui$path failed"
                done
                sleep 5
              done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

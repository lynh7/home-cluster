apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rollout-demo-app
  namespace: flux-system
spec:
  interval: 5m
  path: ./applications/manifests/demo-app
  prune: true
  dependsOn:
    - name: rollout-prometheus-stack # PodMonitor CRD
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m

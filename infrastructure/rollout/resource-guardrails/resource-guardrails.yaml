---
# Source: resource-guardrails/templates/validatingadmissionpolicy.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: resource-guardrails-protect-namespaces
  labels:
    app.kubernetes.io/name: resource-guardrails
    app.kubernetes.io/instance: resource-guardrails
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: resource-guardrails-0.1.0
  annotations:
    kubernetes.io/description: Protect labeled Namespaces from deletion.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - DELETE
      resources:
      - namespaces
      scope: Cluster
  objectSelector:
    matchLabels:
      policy.home-talos-cluster.io/protected: "true"
  validations:
  - expression: "false"
    message: Protected namespaces cannot be deleted.

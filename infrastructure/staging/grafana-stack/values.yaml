######################################
####### Grafana Stack Config #########
######################################
grafana:
  serviceMonitor:
    enabled: true
    #-- Allowing schedule Grafana to run on master node  
  tolerations:
    - key: "critical-components"
      operator: "Equal"
      value: "critical"
      effect: "NoSchedule"
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          type: prometheus        # VM is Prometheus-compatible, use prometheus type
          url: http://victoria-metrics-single-server.monitoring.svc.cluster.local:8428
          access: proxy
          isDefault: true
          editable: false
          jsonData:
            timeInterval: "30s"
  
        - name: VictoriaLogs
          type: loki
          url: http://victoria-logs-single-server.monitoring.svc.cluster.local:9428
          access: proxy
          editable: false
          jsonData:
            maxLines: 1000
  
      deleteDatasources:
        - name: Prometheus
          orgId: 1

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default  
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folder: /var/lib/grafana/dashboards
      searchNamespace: monitoring
      provider:
        foldersFromFilesStructure: true

  persistence:
    type: pvc
    enabled: true
    size: 500Mi
#################################
#### Grafana Alloy Config #####
#################################
grafana-alloy:
  alloy:
    configMap:
      create: true
      content: |
        logging {
          level = "info"
        }

        // ─────────────────────────────────────────────────────────
        // Metrics
        // ─────────────────────────────────────────────────────────

        // ServiceMonitors and PodMonitors – scoped to our own
        // namespaces so we never accidentally scrape tenant or
        // system workloads added by other controllers.
        prometheus.operator.servicemonitors "default" {
          namespaces = ["monitoring", "kube-system", "longhorn-system"]
          scrape_interval = "30s"
          scrape_timeout  = "10s"
          forward_to = [prometheus.remote_write.victoria.receiver]
        }

        prometheus.operator.podmonitors "default" {
          namespaces = ["monitoring", "kube-system", "longhorn-system"]
          scrape_interval = "30s"
          scrape_timeout  = "10s"
          forward_to = [prometheus.remote_write.victoria.receiver]
        }

        // ─────────────────────────────────────────────────────────
        // External node scrapes – consolidated into a single block.
        // honour_labels ensures node_exporter labels take precedence.
        // ─────────────────────────────────────────────────────────
        prometheus.scrape "external_nodes" {
          targets = [
            {
              __address__ = "192.168.10.99:9100",
              job         = "rasp4-node",
              node        = "rasp4-node",
            },
            {
              __address__ = "192.168.10.52:9100",
              job         = "minidesk-host",
              node        = "minidesk-host",
            },
            {
              __address__ = "192.168.10.51:9100",
              job         = "maindesk-host",
              node        = "maindesk-host",
            },
            {
              __address__ = "192.168.10.1:9100",
              job         = "openwrt-router",
              node        = "openwrt-router",
            },
            {
              __address__       = "192.168.10.1:8405",
              __metrics_path__  = "/metrics",
              job               = "haproxy-router",
              node              = "haproxy-router",
            },
          ]

          scrape_interval = "30s"
          scrape_timeout  = "10s"
          honor_labels    = true

          forward_to = [prometheus.remote_write.victoria.receiver]
        }

        // ─────────────────────────────────────────────────────────
        // Remote write to VictoriaMetrics with WAL tuning
        // ─────────────────────────────────────────────────────────
        prometheus.remote_write "victoria" {
          endpoint {
            url = "http://victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/write"

            queue_config {
              max_samples_per_send = 2000
              max_shards           = 30
              capacity             = 10000
            }
          }

          wal {
            truncate_frequency = "2h"
            min_keepalive_time = "5m"
            max_keepalive_time = "8h"
          }

          external_labels = {
            cluster = "homelab-staging",
          }
        }

        // ─────────────────────────────────────────────────────────
        // cAdvisor metrics from kubelet
        // ─────────────────────────────────────────────────────────
        discovery.kubernetes "nodes" {
          role = "node"
        }

        prometheus.scrape "kubelet_cadvisor" {
          targets      = discovery.kubernetes.nodes.targets
          scheme       = "https"
          metrics_path = "/metrics/cadvisor"
          scrape_interval = "30s"
          scrape_timeout  = "10s"
          sample_limit    = 50000

          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

          tls_config {
            ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          }

          forward_to = [prometheus.remote_write.victoria.receiver]

          // Keep only essential container + machine metrics.
          // Everything else (e.g. container_network_adv_tcp_stats_total,
          // container_blkio_*, etc.) is dropped to reduce cardinality.
          metric_relabel_configs {
            source_labels = ["__name__"]
            regex = "container_cpu_.*|container_memory_.*|container_fs_.*|container_network_.*|container_start_time_seconds|container_last_seen|container_oom_events_total|container_spec_.*|container_tasks_state|machine_.*"
            action = "keep"
          }

          // Drop high-cardinality labels that come from container runtimes.
          metric_relabel_configs {
            regex  = "container_label_.+"
            action = "labeldrop"
          }

          metric_relabel_configs {
            regex  = "id"
            action = "labeldrop"
          }
        }

        // ─────────────────────────────────────────────────────────
        // Logs 
        // ─────────────────────────────────────────────────────────
        // Collect pod logs via the Kubernetes API. This avoids privileged
        // host mounts, but it means a single Alloy replica should own
        // collection unless clustering/sharding is introduced deliberately.
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          // Drop pods that are not running — avoids scraping terminating pods
          rule {
            source_labels = ["__meta_kubernetes_pod_phase"]
            action        = "keep"
            regex         = "Running"
          }

          // Namespace as label
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          // Match metrics external_labels so log queries correlate with alerts.
          rule {
            target_label = "cluster"
            replacement  = "homelab-staging"
          }

          // Pod name
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          // Container name — important when a pod has multiple containers
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          // Stable pod UID helps correlate restarts/re-creations of the same pod name.
          rule {
            source_labels = ["__meta_kubernetes_pod_uid"]
            target_label  = "pod_uid"
          }

          // App label (most deployments set this)
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            target_label  = "app"
          }

          // app.kubernetes.io/name (Helm charts use this)
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label  = "app"
            regex         = "(.+)"  // only override if non-empty
          }

          // Helm releases often only set app.kubernetes.io/instance.
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
            target_label  = "instance"
          }

          // Capture the owning workload when app labels are weak or missing.
          rule {
            source_labels = ["__meta_kubernetes_pod_controller_name"]
            target_label  = "workload"
            regex         = "(.+)"
          }

          // Node the pod runs on
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }

          // Compose the job label: namespace/app
          rule {
            source_labels = ["namespace", "app"]
            separator     = "/"
            target_label  = "job"
          }
        }

        loki.source.kubernetes "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.write.victorialogs.receiver]
        }

        loki.write "victorialogs" {
          endpoint {
            url = "http://victoria-logs-single-server.monitoring.svc.cluster.local:9428/insert/loki/api/v1/push"
          }
        }
        
  controller:
    type: 'deployment'
    tolerations:
      - key: "critical-components"
        operator: "Equal"
        value: "critical"
        effect: "NoSchedule"
  serviceMonitor:
    enabled: true
